name: Windows x64 Build & Package

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      version:
        description: 'Tag/Release version (auto-created if missing, assets updated if exists)'
        required: false
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build jemalloc (Windows x64)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: "MSVC (cl.exe)"
            short: "MSVC"
            cc: "cl.exe"
            cxx: "cl.exe"
          - name: "MinGW-GCC"
            short: "MinGW-GCC"
            cc: "gcc"
            cxx: "g++"
        build_type:
          - Release
          - Debug

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - name: Show Environment Info
      shell: cmd
      run: |
        echo === Windows Version ===
        systeminfo | findstr /B /C:"OS Name" /C:"OS Version"
        ver
        echo.
        echo === Architecture ===
        echo PROCESSOR_ARCHITECTURE=%PROCESSOR_ARCHITECTURE%
        echo PROCESSOR_IDENTIFIER=%PROCESSOR_IDENTIFIER%
        echo.

    # ============== MSVC Build ==============
    - name: Setup MSVC environment (x64)
      if: matrix.compiler.cc == 'cl.exe'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup MSYS2 (for autotools)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          autotools
          git
        pacboy: >-
          make:p
          binutils:p

    - name: Build with MSVC (x64)
      if: matrix.compiler.cc == 'cl.exe'
      shell: msys2 {0}
      env:
        CC: cl.exe
        CXX: cl.exe
        AR: lib.exe
        NM: dumpbin.exe
        RANLIB: ":"
        MSYS2_PATH_TYPE: inherit
      run: |
        echo "=== Building jemalloc with MSVC x64 ==="
        
        # Run autoconf to generate configure script
        autoconf
        
        # Configure build
        if [ "${{ matrix.build_type }}" = "Debug" ]; then
          ./configure CC=cl.exe CXX=cl.exe AR=lib.exe --enable-debug
        else
          ./configure CC=cl.exe CXX=cl.exe AR=lib.exe
        fi
        
        # Build
        echo "Building..."
        mingw32-make -j4
        
        # Build tests
        echo "Building tests..."
        mingw32-make tests
        
        # Run tests
        echo "Running tests..."
        mingw32-make -k check || true

    # ============== MinGW-GCC Build ==============
    - name: Build with MinGW-GCC (x64)
      if: matrix.compiler.cc == 'gcc'
      shell: msys2 {0}
      env:
        CC: gcc
        CXX: g++
        EXTRA_CFLAGS: -fcommon
      run: |
        echo "=== Building jemalloc with MinGW-GCC x64 ==="
        
        # Run autoconf to generate configure script
        autoconf
        
        # Configure build
        if [ "${{ matrix.build_type }}" = "Debug" ]; then
          ./configure CC=gcc CXX=g++ --enable-debug EXTRA_CFLAGS=-fcommon
        else
          ./configure CC=gcc CXX=g++ EXTRA_CFLAGS=-fcommon
        fi
        
        # Build
        echo "Building..."
        mingw32-make -j4
        
        # Build tests
        echo "Building tests..."
        mingw32-make tests
        
        # Run tests
        echo "Running tests..."
        mingw32-make -k check || true

    # ============== Package/Artifact ==============
    - name: Create build artifacts directory
      shell: cmd
      run: |
        mkdir build_artifacts\${{ matrix.compiler.short }}_${{ matrix.build_type }}
        
    - name: Package binaries
      shell: cmd
      run: |
        set BUILD_DIR=build_artifacts\${{ matrix.compiler.short }}_${{ matrix.build_type }}
        
        echo Packaging jemalloc binaries...
        
        if exist lib (
          xcopy /E /I /Y lib %BUILD_DIR%\lib
        )
        if exist include (
          xcopy /E /I /Y include %BUILD_DIR%\include
        )
        if exist bin (
          xcopy /E /I /Y bin %BUILD_DIR%\bin
        )
        
        echo Build artifacts created in %BUILD_DIR%

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jemalloc-windows-x64-${{ matrix.compiler.short }}-${{ matrix.build_type }}
        path: build_artifacts/
        retention-days: 30
        if-no-files-found: warn

    # ============== Create Release Package ==============
    - name: Create release package (zip)
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $version = "$env:VERSION"
        if (-not $version) {$version = "0.0.1" }
        $pkgName = "jemalloc-$version-windows-x64-${{ matrix.compiler.short }}-${{ matrix.build_type }}.zip"
        New-Item -ItemType Directory -Force -Path "release_package" | Out-Null
        Copy-Item -Recurse -Path "build_artifacts\*" -Destination "release_package\" -ErrorAction SilentlyContinue
        Compress-Archive -Path "release_package\*" -DestinationPath $pkgName -Force
        Write-Host "Created package: $pkgName"

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: jemalloc-release-x64-${{ matrix.compiler.short }}-${{ matrix.build_type }}
        path: jemalloc-*.zip
        retention-days: 90
        if-no-files-found: error

  # ============== Release: 自动建 tag / 更新资源 ==============
  release:
    name: Create / Update Release
    runs-on: ubuntu-latest
    needs: build-windows-x64
    if: ${{ needs.build-windows-x64.result == 'success' }}
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: jemalloc-release-x64-*
          merge-multiple: true
          path: dist

      - name: List downloaded files
        run: ls -lah dist/

      - name: Create tag+release if missing, update assets if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then TAG="0.0.1"; fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo ">>> Release '$TAG' already exists. Tag untouched, overwriting assets..."
            gh release upload "$TAG" dist/*.zip --clobber
          else
            echo ">>> Tag '$TAG' not found. Creating tag on master HEAD + new release..."
            gh release create "$TAG" \
              --target master \
              --title "jemalloc $TAG - Windows x64" \
              --notes "Automated Windows x64 builds (MSVC / MinGW-GCC, Release / Debug)."
            gh release upload "$TAG" dist/*.zip --clobber
          fi

          echo ">>> Current assets on release '$TAG':"
          gh release view "$TAG" --json assets -q '.assets[].name'

  # ============== Summary ==============
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows-x64, release]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Windows x64 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag / Version**: \`${{ inputs.version }}\`" >>$GITHUB_STEP_SUMMARY
          echo "**Build Job Status**: ${{ needs.build-windows-x64.result }}" >>$GITHUB_STEP_SUMMARY
          echo "**Release Job Status**: ${{ needs.release.result }}" >>$GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform**: Windows x64 (AMD64)" >> $GITHUB_STEP_SUMMARY
